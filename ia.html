<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="ia.css">
     <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="texto-post"> Converse com a IA e aproveite para tirar suas duvidas:</p>
    <form id="meu-form">
            <div class="input-box">
                <label for="email">Digite seu email</label>
                <input type="text" id="email" required>
            </div>
            <div>
                <label for="message">Mande uma message:</label>
                <textarea id="message" required></textarea>
            </div>
            </label>
            <button type="submit">Send</button>
        </form>
    
      <script>
        const form = document.getElementById('meu-form');
        const textoPost = document.getElementById('texto-post');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            textoPost.innerText = "🤖 A IA está pensando...";

            // Faz a requisição direto para o Webhook de PRODUÇÃO do n8n
            const response = await fetch('https://jgabrielrocha.app.n8n.cloud/webhook/1a35a14a-0ff3-46d9-b1d4-2c83cc2b9231', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    message: document.getElementById('message').value
                })
            });

            // Pede para o navegador ler a resposta como texto puro
            const text = await response.text();

            // Substitui o texto pela resposta da IA!
            textoPost.innerHTML = marked.parse(text);
        });
    </script>
</body>
</html>
